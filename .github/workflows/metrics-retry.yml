# Auto-retry for the Metrics workflow.
#
# The forked metrics action rebuilds its Docker image on every run (only the
# upstream lowlighter/metrics is eligible for the pre-built ghcr.io image), so
# each run does a full `npm ci`. That occasionally dies on a transient network
# failure, e.g. sharp failing to download libvips from GitHub releases:
#
#   npm error sharp: Installation error: socket hang up
#
# Rather than duplicating the ~50 lines of plugin config into a second step,
# this re-runs the failed job once. Capped at one retry via run_attempt so a
# genuinely broken build can't loop.
name: Metrics retry
on:
  workflow_run:
    workflows: ["Metrics"]
    types: [completed]
jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "Retrying run $RUN_ID (attempt ${{ github.event.workflow_run.run_attempt }} failed)"
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
